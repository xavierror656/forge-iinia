[project]
name = "edgevision-control-hub"
version = "0.1.0"
description = "Edge desktop hub bridging Forge with on-device inference and GPIO control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7,<6.8",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "PyYAML>=6.0",
    "gpiozero>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "paho-mqtt>=2.1.0",
    "nodegraphqt>=0.6.44",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.7",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# En Jetson (aarch64) usar wheels precompilados con CUDA en lugar de los de PyPI
# Wheels precompilados con CUDA para JetPack 6.1 (Python 3.10, aarch64)
# En x86_64 o Python 3.11+ se usan los wheels normales de PyPI
[tool.uv.sources]
torch = [
    { url = "https://github.com/ultralytics/assets/releases/download/v0.0.0/torch-2.10.0-cp310-cp310-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" },
]
torchvision = [
    { url = "https://github.com/ultralytics/assets/releases/download/v0.0.0/torchvision-0.25.0-cp310-cp310-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" },
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "__pycache__", "captures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — long literal strings in UI text are OK
    "B008",   # Qt frequently uses default arg constructors
    "SIM105", # contextlib.suppress is not always more readable than try/except/pass
    "SIM108", # ternary form would push URL composition past readability
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
files = ["core"]
exclude = "(^|/)(\\.venv|__pycache__|captures|ui|main\\.py)"

[[tool.mypy.overrides]]
module = ["yaml", "cv2", "PyQt6.*", "ultralytics.*", "gpiozero", "gpiozero.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
