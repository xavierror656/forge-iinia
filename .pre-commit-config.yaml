repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^core/
        additional_dependencies: []
        args: ["--config-file=pyproject.toml"]

  - repo: local
    hooks:
      - id: forbid-env-files
        name: Block committing .env files
        entry: bash -c 'if git diff --cached --name-only | grep -E "(^|/)\\.env(\\.local)?$"; then echo "Refusing to commit a .env or .env.local file."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: env-drift
        name: Check .env keys match .env.example
        entry: python scripts/check_env_keys.py
        language: system
        pass_filenames: false
        files: ^(\.env|\.env\.example)$
